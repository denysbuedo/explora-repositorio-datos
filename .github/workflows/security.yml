name: Security analysis

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      packages: read

    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild compiled languages
        if: matrix.language == 'java-kotlin'
        uses: github/codeql-action/autobuild@v4.38.3

      - name: Analyze
        uses: github/codeql-action/analyze@v4.38.3
        with:
          category: /language:${{ matrix.language }}

  dependency-check:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Run OWASP Dependency-Check
        id: sca
        continue-on-error: true
        env:
          CONFIGURED_NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$CONFIGURED_NVD_API_KEY" ]; then
            export NVD_API_KEY="$CONFIGURED_NVD_API_KEY"
          else
            unset NVD_API_KEY
          fi
          ./gradlew dependencyCheckAnalyze --no-daemon

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('build/reports/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.38.3
        with:
          sarif_file: build/reports/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Preserve dependency reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dependency-check-${{ github.run_id }}
          path: build/reports/dependency-check-report.*
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce SCA result
        if: steps.sca.outcome == 'failure'
        run: |
          echo "Dependency-Check failed because of findings at or above the threshold, or because the scan could not complete."
          exit 1
