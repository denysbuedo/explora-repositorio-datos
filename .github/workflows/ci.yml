name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 21 and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Validate security and OCFL tooling
        run: |
          python -m unittest discover -s tools/security -p "test_*.py"
          python -m unittest discover -s tools/ocfl -p "test_*.py"
          python -m unittest discover -s tools/supply_chain -p "test_*.py"
          python tools/security/audit_secrets.py

      - name: Run complete Java test suite and build supply-chain evidence
        run: |
          ./gradlew test bootJar cyclonedxDirectBom --no-daemon
          sha256sum build/libs/base-repo.jar > build/libs/SHA256SUMS
          python tools/supply_chain/verify_evidence.py \
            build/libs/base-repo.jar \
            build/libs/SHA256SUMS \
            build/reports/cyclonedx-direct/bom.json

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-evidence-${{ github.run_id }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/reports/problems/
            build/reports/cyclonedx-direct/
            build/libs/base-repo.jar
            build/libs/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
